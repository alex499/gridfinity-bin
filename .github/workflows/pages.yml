name: Deploy configurator

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'gridfinity.scad'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes one still in flight
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: node build.js

      # every cells x split_lid x closure x part must render clean, or nothing ships
      - run: node verify.js sweep

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
